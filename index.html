<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WordWave – practice the most common English words</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌊</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
:root{--bg:#120c2b;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);--tx:#f7f5ff;--mut:#b2acd4;--pink:#ff4f93;--vio:#7c5cff;--cy:#27d7f0;--lime:#b4f04a;--amb:#ffc23d;--bad:#ff5c7a}
body{font-family:'Fredoka',system-ui,sans-serif;color:var(--tx);min-height:100vh;
 background:radial-gradient(58rem 38rem at 8% -10%,#4a22b855,transparent),radial-gradient(46rem 36rem at 100% 8%,#ff4f9333,transparent),radial-gradient(40rem 30rem at 50% 115%,#27d7f022,transparent),var(--bg);background-attachment:fixed}
.app{max-width:880px;margin:0 auto;padding:18px 16px 56px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--amb);outline-offset:2px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:20px}
.logo{font-weight:700;font-size:1.6rem;letter-spacing:-.5px;background:none;border:0;padding:0}
.logo span{background:linear-gradient(90deg,var(--pink),var(--amb));-webkit-background-clip:text;background-clip:text;color:transparent}
.stats,.row,.chips{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:var(--card);border:1px solid var(--line);padding:6px 13px;border-radius:99px;font-weight:500;font-size:.95rem;backdrop-filter:blur(8px)}
h1{font-size:clamp(1.9rem,5.5vw,3rem);line-height:1.08;letter-spacing:-1px;font-weight:700;max-width:16ch}
h1 em{font-style:normal;color:var(--amb)}
h2{font-size:1.25rem;margin:26px 0 12px}
.sub{color:var(--mut);margin:10px 0 16px;max-width:46ch}
.meter{height:12px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;max-width:420px}
.meter i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--cy),var(--lime));transition:width .6s}
small{color:var(--mut)}
.chip{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:.95rem;transition:.15s}
.chip:hover{border-color:var(--cy)}
.chip.on{background:var(--cy);border-color:var(--cy);color:#06222a;font-weight:600}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:18px 0 6px}
.mode{position:relative;overflow:hidden;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:20px 20px 18px;transition:.2s;display:flex;flex-direction:column;gap:4px}
.mode:before{content:"";position:absolute;inset:0;background:linear-gradient(145deg,var(--c),transparent 62%);opacity:.28}
.mode>*{position:relative}
.mode:hover{transform:translateY(-4px) rotate(-.6deg);border-color:var(--c)}
.mode .em{font-size:2.4rem}.mode h3{font-size:1.3rem}.mode p{color:var(--mut);font-size:.93rem}.mode small{color:var(--c);font-weight:600;margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.tile{text-align:center;padding:10px 4px 8px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-weight:500;transition:.15s}
.tile:hover{transform:scale(1.08)}
.tile i{display:block;height:4px;border-radius:2px;margin:6px 10px 0;background:linear-gradient(90deg,var(--lime) var(--p),rgba(255,255,255,.14) 0)}
.l1,.l2{background:#7c5cff33;border-color:#7c5cff88}.l3,.l4{background:#27d7f02a;border-color:#27d7f099}
.l5{background:linear-gradient(135deg,#b4f04a55,#ffc23d44);border-color:var(--lime)}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--mut);font-size:.88rem;margin:-4px 0 12px}
.reset{background:none;border:0;color:var(--mut);text-decoration:underline;margin-top:26px;font-size:.9rem}
/* game chrome */
.hud{display:flex;align-items:center;gap:10px}
.prog{flex:1;height:12px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--amb));border-radius:99px;transition:width .4s}
.ghost,.btn{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 16px;font-weight:500}
.btn{background:linear-gradient(135deg,var(--vio),var(--pink));border:0;font-weight:600;padding:12px 24px;font-size:1.05rem;box-shadow:0 8px 24px #ff4f9340;transition:.15s}
.btn:hover{transform:translateY(-2px)}
.hud .grow{flex:1}
/* word rain */
.field{position:relative;height:min(56vh,520px);border-radius:26px;border:1px solid var(--line);background:linear-gradient(#ffffff08,#7c5cff1c);overflow:hidden;margin:12px 0}
.field:after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--pink),var(--amb),var(--cy));box-shadow:0 0 26px var(--pink)}
.field.hurt{animation:flash .35s}
.drop{position:absolute;top:0;padding:7px 17px;border-radius:99px;font-weight:600;font-size:1.3rem;background:linear-gradient(135deg,var(--vio),var(--pink));box-shadow:0 6px 20px #0007;will-change:transform;white-space:nowrap}
.drop.hit{outline:3px solid var(--lime)}
.drop.pop{animation:pop .3s forwards;background:var(--lime);color:#17300a}
.typer input,.card input{width:100%;font:inherit;font-size:1.3rem;font-weight:500;color:var(--tx);background:rgba(255,255,255,.09);border:2px solid var(--line);border-radius:20px;padding:14px 18px;text-align:center}
.typer input:focus,.card input:focus{outline:none;border-color:var(--cy);box-shadow:0 0 0 4px #27d7f033}
.shake{animation:shake .3s}
/* rounds */
.card{background:var(--card);border:1px solid var(--line);border-radius:30px;padding:26px 20px;margin-top:16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px}
.card input{max-width:360px}
.q{color:var(--mut);font-size:1.05rem}
.speak{width:104px;height:104px;border-radius:50%;border:0;font-size:2.6rem;background:linear-gradient(135deg,var(--cy),var(--vio));box-shadow:0 0 0 0 #27d7f066;animation:pulse 2s infinite}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:440px}
.opt{padding:16px 8px;font-size:1.4rem;font-weight:600;border-radius:20px;background:rgba(255,255,255,.09);border:2px solid var(--line);transition:.15s}
.opt:hover{border-color:var(--cy);transform:translateY(-2px)}
.good{background:#7fd62a55!important;border-color:var(--lime)!important}
.bad{background:#ff5c7a44!important;border-color:var(--bad)!important}
.flash{font-size:clamp(2.6rem,12vw,4.4rem);font-weight:700;padding:8px 28px;border-radius:24px;transition:filter .5s,opacity .5s;min-width:160px}
.flash.gone{filter:blur(18px);opacity:.12}
.fb{min-height:1.5em;font-weight:600}
.big{font-size:3.4rem;font-weight:700;line-height:1}
@keyframes pop{to{scale:1.7;opacity:0}}
@keyframes shake{25%{translate:-7px}75%{translate:7px}}
@keyframes flash{50%{background:#ff5c7a55}}
@keyframes pulse{70%{box-shadow:0 0 0 24px #27d7f000}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="logo" data-act="home" aria-label="Home"><span>WordWave</span> 🌊</button>
    <div class="stats" id="stats"></div>
  </header>
  <main id="view"></main>
</div>

<script>
/* ==========================================================
   ADD MORE WORDS HERE – just append them to the list below.
   The game adjusts automatically (word groups, progress, etc.)
   ========================================================== */
const WORDS = ("the be to of and a in that have I it for not on with he as you do at this but his by from they we say her she or an will my one all would there their what so up out if about who get which go me when make can like time no just him know take people into year your good some could them see other than then now look only come its over think also back after use two how our work first well way even new want because any these give day most us").split(" ");

/* Words that sound the same are never shown together in "Listen & Pick".
   Add pairs here when you add words like write/right or see/sea. */
const HOMOPHONES = [["to","two"],["there","their"],["no","know"]];

/* ---------- helpers & saved progress ---------- */
const $ = s => document.querySelector(s);
const view = $('#view');
const SIZE = 25;
let range = 'all', G = null;
let store = {stats:{}, best:{}, xp:0, streak:0, day:''};
try { Object.assign(store, JSON.parse(localStorage.getItem('wordwave') || '{}')); } catch(e) {}
const save = () => { try { localStorage.setItem('wordwave', JSON.stringify(store)); } catch(e) {} };
const shuffle = a => a.map(x => [Math.random(), x]).sort((p,q) => p[0]-q[0]).map(x => x[1]);
const same = (a,b) => HOMOPHONES.some(p => p.includes(a.toLowerCase()) && p.includes(b.toLowerCase()));
const lv = w => { const s = store.stats[w]; return s ? Math.max(0, Math.min(5, s.c - Math.floor(s.w/2))) : 0; };
const pool = () => range === 'all' ? WORDS : WORDS.slice(range*SIZE, range*SIZE+SIZE);
// words you know less well come up more often
const pickWords = n => pool().map(w => [w, Math.random() ** (1/(1+(5-lv(w))*1.5))]).sort((a,b) => b[1]-a[1]).slice(0,n).map(x => x[0]);
function say(w){ try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(w); u.lang='en-US'; u.rate=.85; speechSynthesis.speak(u); } catch(e) {} }
function touch(){
  const d = new Date().toDateString(); if (store.day === d) return;
  store.streak = store.day === new Date(Date.now()-864e5).toDateString() ? store.streak+1 : 1; store.day = d;
}
function record(w, ok){
  const s = store.stats[w] || (store.stats[w] = {c:0, w:0});
  if (ok) { s.c++; store.xp += 5; } else s.w++;
  touch(); save(); hdr();
}
const hdr = () => $('#stats').innerHTML = `<span class="pill" title="Days in a row">🔥 ${store.streak||0}</span><span class="pill" title="Points">⭐ ${store.xp||0}</span>`;
function stop(){ if (G && G.stop) G.stop(); G = null; try { speechSynthesis.cancel(); } catch(e) {} }
function bestOf(k, of){ const b = store.best[k]; return b ? `Best: ${b}${of||''}` : 'Not played yet'; }

/* ---------- home ---------- */
function home(){
  stop(); hdr();
  const mastered = WORDS.filter(w => lv(w) >= 5).length;
  const n = Math.ceil(WORDS.length/SIZE);
  const ranges = [['all','All words'], ...Array.from({length:n}, (_,i) => [i, `${i*SIZE+1}–${Math.min(WORDS.length,(i+1)*SIZE)}`])];
  view.innerHTML = `
  <h1>Learn the <em>${WORDS.length}</em> words you'll see everywhere</h1>
  <p class="sub">Play a quick round, and the words you miss come back more often.</p>
  <div class="meter"><i style="width:${mastered/WORDS.length*100}%"></i></div>
  <small>${mastered} of ${WORDS.length} words mastered</small>
  <h2>Which words?</h2>
  <div class="chips">${ranges.map(([k,t]) => `<button class="chip ${String(range)===String(k)?'on':''}" data-act="range" data-r="${k}">${t}</button>`).join('')}</div>
  <div class="modes">
    <button class="mode" style="--c:var(--pink)" data-act="rain"><span class="em">🌧️</span><h3>Word Rain</h3><p>Words fall from the sky. Type them before they splash down.</p><small>${bestOf('rain',' pts')}</small></button>
    <button class="mode" style="--c:var(--cy)" data-act="listen"><span class="em">🎧</span><h3>Listen &amp; Pick</h3><p>Hear a word, then tap the right one out of four.</p><small>${bestOf('listen','/10')}</small></button>
    <button class="mode" style="--c:var(--amb)" data-act="flash"><span class="em">⚡</span><h3>Flash &amp; Type</h3><p>A word flashes for a second. Type it from memory.</p><small>${bestOf('flash','/10')}</small></button>
  </div>
  <h2>Your word garden</h2>
  <div class="legend"><span>Tap a word to hear it. The bar fills as you learn it.</span></div>
  <div class="grid">${pool().map(w => `<button class="tile l${lv(w)}" data-act="say" data-w="${w}">${w}<i style="--p:${lv(w)*20}%"></i></button>`).join('')}</div>
  <button class="reset" data-act="reset">Reset my progress</button>`;
}

/* ---------- results screen ---------- */
function results({emoji, big, line, missed, mode}){
  view.innerHTML = `<div class="card"><div class="big">${emoji}</div><h2 style="margin:0">${big}</h2><p class="q">${line}</p>
  ${missed.length ? `<p class="q">Give these another listen:</p><div class="chips" style="justify-content:center">${missed.map(w => `<button class="chip" data-act="say" data-w="${w}">🔊 ${w}</button>`).join('')}</div>` : ''}
  <div class="row" style="justify-content:center"><button class="btn" data-act="${mode}">Play again</button><button class="ghost" data-act="home">Home</button></div></div>`;
}

/* ---------- mode 1: Word Rain ---------- */
function rain(){
  stop();
  view.innerHTML = `<div class="hud"><button class="ghost" data-act="home" aria-label="Quit">✕</button><span class="grow"></span><span class="pill">Score <b id="sc">0</b></span><span class="pill">Level <b id="lvl">1</b></span><span class="pill" id="lives"></span></div>
  <div class="field" id="field"></div>
  <div class="typer"><input id="inp" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="type a word, then press Enter or space" aria-label="Type the falling word"></div>`;
  const field = $('#field'), inp = $('#inp');
  let items = [], queue = [], missed = new Set(), score = 0, lives = 3, popped = 0, level = 1, spawnT = .2, last = 0, raf = 0, over = false;
  const hud = () => { $('#sc').textContent = score; $('#lvl').textContent = level; $('#lives').textContent = '❤️'.repeat(lives) + '🖤'.repeat(3-lives); };
  hud(); inp.focus();

  function spawn(){
    if (!queue.length) queue = pickWords(12);
    const w = queue.pop(); if (items.some(i => i.w === w)) return;
    const el = document.createElement('div'); el.className = 'drop'; el.textContent = w; field.appendChild(el);
    const x = 6 + Math.random() * Math.max(0, field.clientWidth - el.offsetWidth - 12);
    el.style.left = x + 'px'; items.push({w, el, y:-44});
  }
  function miss(it){
    items.splice(items.indexOf(it), 1); it.el.remove(); record(it.w, false); missed.add(it.w); lives--; hud();
    field.classList.remove('hurt'); void field.offsetWidth; field.classList.add('hurt');
    if (lives <= 0) end();
  }
  function tick(t){
    const dt = Math.min(50, t-last)/1000; last = t; spawnT -= dt;
    if (spawnT <= 0) { spawn(); spawnT = Math.max(.85, 2.5 - level*.2); }
    const h = field.clientHeight, sp = 42 + level*9;
    for (const it of items.slice()) { it.y += sp*dt; it.el.style.transform = `translateY(${it.y}px)`; if (it.y > h-44) miss(it); }
    if (!over) raf = requestAnimationFrame(tick);
  }
  function submit(){
    const v = inp.value.trim().toLowerCase(); inp.value = ''; items.forEach(i => i.el.classList.remove('hit')); if (!v) return;
    const t = items.filter(i => i.w.toLowerCase() === v).sort((a,b) => b.y-a.y)[0];
    if (!t) { inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake'); return; }
    items.splice(items.indexOf(t), 1); t.el.classList.add('pop'); setTimeout(() => t.el.remove(), 300);
    record(t.w, true); score += 10 + t.w.length; popped++; level = 1 + Math.floor(popped/8); hud();
  }
  function end(){
    over = true; cancelAnimationFrame(raf);
    const rec = score > (store.best.rain || 0); if (rec) store.best.rain = score; save();
    results({emoji: rec ? '🏆' : score > 80 ? '🌟' : '💪', big: `${score} points`, line: rec ? 'New personal best!' : `${popped} words caught. Best: ${store.best.rain||0}`, missed: [...missed], mode: 'rain'});
  }
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  inp.addEventListener('input', () => {
    if (inp.value.endsWith(' ')) return submit();
    const v = inp.value.trim().toLowerCase();
    items.forEach(i => i.el.classList.toggle('hit', !!v && i.w.toLowerCase().startsWith(v)));
  });
  G = {stop(){ over = true; cancelAnimationFrame(raf); }};
  raf = requestAnimationFrame(t => { last = t; tick(t); });
}

/* ---------- modes 2 & 3: Listen & Pick, Flash & Type ---------- */
function rounds(mode){
  stop();
  const ws = pickWords(Math.min(10, pool().length));
  let i = 0, ok = 0, st = 0, locked = false, timer = 0; const missed = [];
  G = {stop(){ clearTimeout(timer); }};

  function fin(w, good, ms){
    if (locked) return; locked = true; record(w, good);
    if (good) { ok++; st++; } else { st = 0; missed.push(w); }
    timer = setTimeout(() => { i++; show(); }, ms);
  }
  function show(){
    if (i >= ws.length) return done();
    locked = false; const w = ws[i];
    const head = `<div class="hud"><button class="ghost" data-act="home" aria-label="Quit">✕</button><div class="prog"><i style="width:${i/ws.length*100}%"></i></div><span class="pill">🔥 ${st}</span></div>`;
    if (mode === 'listen') {
      const o = shuffle([w, ...shuffle(WORDS.filter(x => x !== w && !same(x, w))).slice(0,3)]);
      view.innerHTML = head + `<div class="card"><p class="q">Which word did you hear?</p><button class="speak" data-act="say" data-w="${w}" aria-label="Play the word again">🔊</button>
        <div class="opts">${o.map(x => `<button class="opt" data-w="${x}">${x}</button>`).join('')}</div></div>`;
      say(w);
      view.querySelector('.opts').onclick = e => {
        const b = e.target.closest('.opt'); if (!b || locked) return;
        const good = b.dataset.w === w; b.classList.add(good ? 'good' : 'bad');
        if (!good) [...view.querySelectorAll('.opt')].find(x => x.dataset.w === w).classList.add('good');
        fin(w, good, good ? 800 : 1500);
      };
    } else {
      view.innerHTML = head + `<div class="card"><p class="q">Remember it, then type it!</p><div class="flash" id="fl">${w}</div>
        <input id="inp" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="type it from memory" aria-label="Type the word">
        <button class="btn" id="go">Check</button><p class="fb" id="fb"></p></div>`;
      say(w);
      const fl = $('#fl'), inp = $('#inp'); inp.focus();
      timer = setTimeout(() => fl.classList.add('gone'), 1300);
      const check = () => {
        if (locked || !inp.value.trim()) return;
        const good = inp.value.trim().toLowerCase() === w.toLowerCase(); clearTimeout(timer);
        fl.classList.remove('gone'); fl.classList.add(good ? 'good' : 'bad');
        $('#fb').textContent = good ? 'Perfect!' : `Close. It's "${w}".`;
        fin(w, good, good ? 900 : 1800);
      };
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
      $('#go').onclick = check;
    }
  }
  function done(){
    const rec = ok > (store.best[mode] || 0); if (rec) store.best[mode] = ok; save();
    const pct = ok/ws.length;
    results({emoji: pct >= .9 ? '🏆' : pct >= .6 ? '🌟' : '💪', big: `${ok} / ${ws.length}`, line: rec ? 'New personal best!' : (pct >= .9 ? 'Amazing round!' : 'Nice work. Every round makes these stick.'), missed, mode});
  }
  show();
}

/* ---------- clicks ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'home') home();
  else if (a === 'rain') rain();
  else if (a === 'listen' || a === 'flash') rounds(a);
  else if (a === 'say') say(b.dataset.w);
  else if (a === 'range') { range = b.dataset.r === 'all' ? 'all' : +b.dataset.r; home(); }
  else if (a === 'reset' && confirm('Erase all your progress and scores?')) { store = {stats:{}, best:{}, xp:0, streak:0, day:''}; save(); home(); }
});
home();
</script>
</body>
</html>
