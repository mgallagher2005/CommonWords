<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WordWave – type the most common English words</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌊</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
:root{--bg:#120c2b;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.14);--tx:#f7f5ff;--mut:#b2acd4;--dim:#6f679a;--pink:#ff4f93;--vio:#7c5cff;--cy:#27d7f0;--lime:#b4f04a;--amb:#ffc23d}
body{font-family:'Fredoka',system-ui,sans-serif;color:var(--tx);min-height:100vh;
 background:radial-gradient(58rem 38rem at 8% -10%,#4a22b855,transparent),radial-gradient(46rem 36rem at 100% 8%,#ff4f9330,transparent),radial-gradient(40rem 30rem at 50% 115%,#27d7f022,transparent),var(--bg);background-attachment:fixed}
.app{max-width:960px;margin:0 auto;padding:18px 16px 56px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--amb);outline-offset:2px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:26px}
.logo{font-weight:700;font-size:1.6rem;letter-spacing:-.5px;background:none;border:0;padding:0}
.logo span{background:linear-gradient(90deg,var(--pink),var(--amb));-webkit-background-clip:text;background-clip:text;color:transparent}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:var(--card);border:1px solid var(--line);padding:6px 13px;border-radius:99px;font-weight:500;font-size:.95rem}
small{color:var(--mut)}
/* control bar */
.bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px 16px;margin-bottom:14px}
.setname{font-weight:600;font-size:1.15rem}
.toggles{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tog{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 14px 6px 10px;font-size:.92rem;transition:.15s}
.tog:before{content:"";width:26px;height:14px;border-radius:9px;background:rgba(255,255,255,.18) radial-gradient(circle at 7px 50%,#fff 5px,transparent 5.5px);transition:.2s}
.tog[aria-pressed=true]{border-color:var(--amb)}
.tog[aria-pressed=true]:before{background:var(--amb) radial-gradient(circle at 19px 50%,#2a1b00 5px,transparent 5.5px)}
.icon{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:1.15rem}
.icon:hover{border-color:var(--cy)}
/* live stats */
.live{display:flex;gap:30px;align-items:baseline;min-height:3.2rem;margin:6px 4px 8px;color:var(--amb)}
.live b{font-size:2.2rem;font-weight:600;font-variant-numeric:tabular-nums}
.live small{margin-left:6px;font-size:.95rem}
.live .off{visibility:hidden}
/* typing area */
.area{position:relative;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:14px 24px;cursor:text}
.clip{height:8.1rem;overflow:hidden;transition:filter .25s,opacity .25s}
.words{position:relative;display:flex;flex-wrap:wrap;column-gap:1.3ch;font:500 clamp(1.2rem,3.6vw,1.75rem)/2.7rem 'JetBrains Mono',ui-monospace,monospace;transition:transform .18s}
.w{flex:none;height:2.7rem;white-space:pre;border-bottom:2px solid transparent}
.w.bad{border-bottom-color:var(--pink)}
.l{color:var(--dim)}
.now .l{color:#9d94d0}
.l.c{color:var(--tx)}.l.e{color:var(--pink)}.l.x{color:var(--pink);opacity:.65}
.done .l.c{color:#8f88bd}
.caret{position:absolute;width:3px;height:1.9rem;border-radius:2px;background:var(--amb);box-shadow:0 0 12px var(--amb);transition:left .09s,top .09s;animation:blink 1s steps(2) infinite}
.caret.typing{animation:none}
.hint{position:absolute;inset:0;display:grid;place-items:center;font-weight:600;color:var(--tx);opacity:0;pointer-events:none;transition:opacity .25s}
.area.blur .hint{opacity:1}
.area.blur .clip{filter:blur(6px);opacity:.35}
.meter{height:6px;border-radius:9px;background:rgba(255,255,255,.1);margin:14px 4px 0;overflow:hidden}
.meter i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--cy),var(--lime));transition:width .2s}
.ghostinp{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;left:0;top:0}
.tip{margin:14px 4px 0;color:var(--mut);font-size:.9rem}
kbd{font:inherit;font-size:.82rem;border:1px solid var(--line);border-radius:7px;padding:1px 7px;background:var(--card)}
/* results */
.res{display:flex;flex-direction:column;gap:22px;padding:22px 8px 6px}
.heroes{display:flex;gap:44px;flex-wrap:wrap;align-items:flex-end}
.hero small{display:block;font-size:1.1rem}
.hero b{font-size:clamp(3.6rem,13vw,5.6rem);line-height:1;font-weight:700;background:linear-gradient(135deg,var(--amb),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero em{font-style:normal;color:var(--lime);font-weight:600;margin-left:10px}
.facts{display:flex;gap:30px;flex-wrap:wrap}
.facts b{display:block;font-size:1.6rem;font-weight:600}
.q{color:var(--mut)}
.chips,.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font:500 .95rem 'JetBrains Mono',monospace}
.chip:hover{border-color:var(--cy)}
.btn{border:0;background:linear-gradient(135deg,var(--vio),var(--pink));border-radius:99px;font-weight:600;padding:12px 26px;font-size:1.05rem;box-shadow:0 8px 24px #ff4f9340;transition:.15s}
.btn:hover{transform:translateY(-2px)}
/* word sets */
h2{font-size:1.2rem;margin:38px 0 12px;display:flex;align-items:center;gap:10px}
.tag{font-size:.8rem;font-weight:500;color:var(--amb);border:1px solid var(--amb);border-radius:99px;padding:2px 10px}
.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.set{display:flex;flex-direction:column;gap:2px;text-align:left;padding:16px 18px;border-radius:22px;background:var(--card);border:1px solid var(--line);transition:.15s}
.set b{font-size:2rem;line-height:1.1}
.set span{color:var(--mut);font-size:.92rem}
.set em{font-style:normal;font-size:.9rem;margin-top:8px;color:var(--cy)}
button.set:hover{transform:translateY(-3px);border-color:var(--cy)}
.set.on{border-color:var(--amb);background:linear-gradient(145deg,#ffc23d26,transparent 70%)}
.set.on em{color:var(--amb)}
.set.locked{border-style:dashed;cursor:not-allowed;opacity:.6;background:repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 10px,transparent 10px 20px)}
.set.locked em{color:var(--mut)}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="logo" id="logo" aria-label="Restart"><span>WordWave</span> 🌊</button>
    <div class="pills" id="pills"></div>
  </header>

  <div class="bar">
    <div class="setname" id="setname"></div>
    <div class="toggles" role="group" aria-label="Show while typing">
      <button class="tog" data-k="timer" aria-pressed="true">Timer</button>
      <button class="tog" data-k="wpm" aria-pressed="true">WPM</button>
      <button class="tog" data-k="prog" aria-pressed="true">Typed / left</button>
      <button class="icon" id="rs" title="Restart (Tab)" aria-label="Restart test">↻</button>
    </div>
  </div>

  <main id="test"></main>
  <section id="sets"></section>
</div>

<script>
/* ==========================================================
   WORD SETS. To add more words later, paste them into the
   matching set below (as a space-separated string). A set
   with words in it is unlocked automatically.
   ========================================================== */
const W100 = "the be to of and a in that have I it for not on with he as you do at this but his by from they we say her she or an will my one all would there their what so up out if about who get which go me when make can like time no just him know take people into year your good some could them see other than then now look only come its over think also back after use two how our work first well way even new want because any these give day most us";
const SETS = [
  {n:100,  words:W100.split(" ")},
  {n:250,  words:[]},
  {n:500,  words:[]},
  {n:750,  words:[]},
  {n:1000, words:[]}
];

/* ---------- helpers & saved settings ---------- */
const $ = s => document.querySelector(s);
let store = {best:{}, tests:0, opts:{timer:true, wpm:true, prog:true}};
try { const s = JSON.parse(localStorage.getItem('wordwave-typing') || '{}'); Object.assign(store, s); store.opts = Object.assign({timer:true, wpm:true, prog:true}, s.opts); } catch(e) {}
const save = () => { try { localStorage.setItem('wordwave-typing', JSON.stringify(store)); } catch(e) {} };
const shuffle = a => { a = a.slice(); for (let i = a.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = s => Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0');
function say(w){ try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(w); u.lang = 'en-US'; u.rate = .85; speechSynthesis.speak(u); } catch(e) {} }
const pills = () => $('#pills').innerHTML = `<span class="pill">🏆 Best ${store.best[setN] || 0} wpm</span><span class="pill">⌨️ ${store.tests} tests</span>`;

/* ---------- test state ---------- */
let setN = 100, T = [], els = [], cur = 0, typed = '', prevLen = 0;
let started = false, finished = false, t0 = 0, tick = 0, caretT = 0;
let cc = 0, rawc = 0, ck = 0, wk = 0, missed = [];
let words, caret, area, inp;

function applyOpts(){
  document.querySelectorAll('.tog').forEach(b => b.setAttribute('aria-pressed', store.opts[b.dataset.k]));
  [['timer','.s-timer'], ['wpm','.s-wpm'], ['prog','.s-prog']].forEach(([k, sel]) => { const e = $(sel); if (e) e.classList.toggle('off', !store.opts[k]); });
}

function newTest(){
  clearInterval(tick);
  const set = SETS.find(s => s.n === setN);
  T = shuffle(set.words); cur = 0; typed = ''; prevLen = 0; started = finished = false;
  cc = rawc = ck = wk = 0; missed = [];
  $('#setname').textContent = `Top ${setN} words`; pills();
  $('#test').innerHTML = `
    <div class="live"><div class="s-timer"><b id="vT">0:00</b></div><div class="s-wpm"><b id="vW">0</b><small>wpm</small></div><div class="s-prog"><b id="vP">0</b><small>typed</small> &nbsp; <b id="vR">${T.length}</b><small>left</small></div></div>
    <div class="area blur" id="area"><div class="clip"><div class="words" id="words"><i class="caret" id="caret"></i>${T.map(w => `<span class="w">${[...w].map(c => `<span class="l">${c}</span>`).join('')}</span>`).join('')}</div></div><div class="hint">Click here or start typing</div></div>
    <div class="meter"><i id="bar"></i></div>
    <p class="tip"><kbd>Tab</kbd> restart &nbsp; <kbd>Space</kbd> next word</p>
    <input class="ghostinp" id="inp" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Type the words shown">`;
  words = $('#words'); caret = $('#caret'); area = $('#area'); inp = $('#inp');
  els = [...words.querySelectorAll('.w')]; els[0].classList.add('now');
  applyOpts(); place();
  area.onclick = () => inp.focus();
  inp.onfocus = () => area.classList.remove('blur');
  inp.onblur = () => { if (!finished) area.classList.add('blur'); };
  inp.oninput = onInput;
  inp.focus();
  if (document.fonts) document.fonts.ready.then(place);
}

function paint(i, t){
  const w = T[i]; let h = '';
  for (let k = 0; k < Math.max(w.length, t.length); k++) {
    const c = w[k], x = t[k];
    if (c === undefined) h += `<span class="l x">${x}</span>`;
    else if (x === undefined) h += `<span class="l">${c}</span>`;
    else h += `<span class="l ${x.toLowerCase() === c.toLowerCase() ? 'c' : 'e'}">${c}</span>`;
  }
  els[i].innerHTML = h;
}

function place(){
  const a = els[cur]; if (!a || finished) return;
  const L = a.children, n = typed.length, last = Math.min(n, L.length);
  const x = n < L.length ? L[n].offsetLeft : L[L.length-1].offsetLeft + L[L.length-1].offsetWidth;
  caret.style.left = (x - 1) + 'px';
  caret.style.top = (a.offsetTop + (a.offsetHeight - caret.offsetHeight)/2) + 'px';
  const shift = Math.max(0, a.offsetTop - els[0].offsetTop - els[0].offsetHeight);
  words.style.transform = `translateY(${-shift}px)`;
}

function start(){ started = true; t0 = performance.now(); tick = setInterval(update, 250); }

function update(){
  if (!$('#vT')) return;
  const s = started ? (performance.now() - t0)/1000 : 0;
  const part = [...typed].filter((c, k) => T[cur] && c.toLowerCase() === (T[cur][k] || '').toLowerCase()).length;
  $('#vT').textContent = fmt(s);
  $('#vW').textContent = s < 1 ? 0 : Math.round((cc + part)/5/(s/60));
  $('#vP').textContent = cur; $('#vR').textContent = T.length - cur;
  $('#bar').style.width = (cur/T.length*100) + '%';
}

function onInput(){
  if (finished) return;
  let v = inp.value;
  if (!started && v.trim()) start();
  if (/\s/.test(v)) {                       // space = submit the word
    const t = v.replace(/\s+/g, ''); inp.value = '';
    if (t) commit(t, false);
    return;
  }
  const w = T[cur];
  if (v.length > w.length + 8) { v = v.slice(0, w.length + 8); inp.value = v; }
  if (v.length > prevLen) { const k = v.length - 1; (k < w.length && v[k].toLowerCase() === w[k].toLowerCase()) ? ck++ : wk++; }
  prevLen = v.length; typed = v;
  if (cur === T.length - 1 && v.toLowerCase() === w.toLowerCase()) return commit(v, true);   // last word needs no space
  paint(cur, typed); place(); update();
  caret.classList.add('typing'); clearTimeout(caretT); caretT = setTimeout(() => caret.classList.remove('typing'), 500);
}

function commit(t, auto){
  const w = T[cur], ok = t.toLowerCase() === w.toLowerCase();
  if (!auto) ok ? ck++ : wk++;
  if (ok) cc += w.length + (auto ? 0 : 1); else missed.push(w);
  rawc += t.length + (auto ? 0 : 1);
  paint(cur, t); els[cur].classList.remove('now'); els[cur].classList.add(ok ? 'done' : 'bad');
  cur++; typed = ''; prevLen = 0; inp.value = '';
  if (cur >= T.length) return finish();
  els[cur].classList.add('now'); paint(cur, ''); place(); update();
}

function finish(){
  finished = true; clearInterval(tick);
  const s = Math.max(.5, (performance.now() - t0)/1000), m = s/60;
  const wpm = Math.round(cc/5/m), raw = Math.round(rawc/5/m), acc = Math.round(ck/Math.max(1, ck+wk)*100);
  const rec = wpm > (store.best[setN] || 0); if (rec) store.best[setN] = wpm;
  store.tests++; save(); pills();
  $('#test').innerHTML = `<div class="area"><div class="res">
    <div class="heroes"><div class="hero"><small>wpm</small><b>${wpm}</b>${rec ? '<em>New best!</em>' : ''}</div><div class="hero"><small>accuracy</small><b>${acc}%</b></div></div>
    <div class="facts"><span><small>raw speed</small><b>${raw}</b></span><span><small>time</small><b>${fmt(s)}</b></span><span><small>words</small><b>${T.length}</b></span><span><small>missed words</small><b>${missed.length}</b></span></div>
    ${missed.length ? `<div><p class="q" style="margin-bottom:8px">Words to practice (tap to hear them)</p><div class="chips">${missed.map(w => `<button class="chip" data-say="${w}">🔊 ${w}</button>`).join('')}</div></div>` : '<p class="q">Every word was right. Flawless!</p>'}
    <div class="row"><button class="btn" id="again">Next test</button><small>or press <kbd>Enter</kbd></small></div>
  </div></div>`;
  $('#again').onclick = newTest;
  $('#test').querySelectorAll('[data-say]').forEach(b => b.onclick = () => say(b.dataset.say));
}

/* ---------- word sets (locked ones are not clickable) ---------- */
function renderSets(){
  const ready = SETS.filter(s => s.words.length), wip = SETS.filter(s => !s.words.length);
  $('#sets').innerHTML = `<h2>Word sets</h2>
    <div class="sets">${ready.map(s => `<button class="set ${s.n === setN ? 'on' : ''}" data-n="${s.n}"><b>${s.n}</b><span>most common words</span><em>${s.n === setN ? 'Selected' : 'Practice this set'}</em></button>`).join('')}</div>
    ${wip.length ? `<h2>Work in progress <span class="tag">coming soon</span></h2>
    <div class="sets">${wip.map(s => `<div class="set locked" aria-disabled="true"><b>${s.n}</b><span>most common words</span><em>🔒 Not ready yet</em></div>`).join('')}</div>` : ''}`;
}

/* ---------- events ---------- */
document.querySelectorAll('.tog').forEach(b => b.onclick = () => {
  store.opts[b.dataset.k] = !store.opts[b.dataset.k]; save(); applyOpts(); if (inp && !finished) inp.focus();
});
$('#rs').onclick = $('#logo').onclick = newTest;
$('#sets').onclick = e => {
  const b = e.target.closest('[data-n]'); if (!b) return;
  setN = +b.dataset.n; renderSets(); newTest(); window.scrollTo({top:0, behavior:'smooth'});
};
document.addEventListener('keydown', e => {
  if (finished && e.key === 'Enter') { e.preventDefault(); newTest(); }
  else if (!finished && (e.key === 'Escape' || (e.key === 'Tab' && !e.shiftKey && document.activeElement === inp))) { e.preventDefault(); newTest(); }
});
window.addEventListener('resize', place);
renderSets(); newTest();
</script>
</body>
</html>
